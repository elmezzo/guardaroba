<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guardaroba</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guardaroba">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: colonna da telefono come una rivista di moda. Testate in Bodoni, filetti sottili, foto in formato 3:4, barra di navigazione in basso. */
:root{
  --bg:#f5f3ee; --surface:#fbfaf7; --sunk:#ebe8e1; --line:#d9d4ca; --fg:#161514; --muted:#6f6a62;
  --accent:#8a7550; --accent-fg:#fbfaf7; --good:#4d6b4f; --bad:#8b3d36;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  --navh:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0e0d; --surface:#171614; --sunk:#1f1d1a; --line:#2e2b27; --fg:#ece7de; --muted:#9b948a;
  --accent:#cdb58a; --accent-fg:#14120f; --good:#93b493; --bad:#d58a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0e0d; --surface:#171614; --sunk:#1f1d1a; --line:#2e2b27; --fg:#ece7de; --muted:#9b948a;
  --accent:#cdb58a; --accent-fg:#14120f; --good:#93b493; --bad:#d58a80; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:300 16px/1.55 var(--body);letter-spacing:.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 28px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:30px;padding-block:calc(env(safe-area-inset-top,0px) + 22px) 10px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:2.6rem;line-height:1.02}
h1 em,h2 em{font-style:italic}
h2{font-size:1.55rem;line-height:1.15}
h3{font-size:1.15rem;line-height:1.2}
.lbl{font:400 .7rem/1.3 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.head{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.head .row{justify-content:space-between;align-items:flex-end}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
section{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
/* bottoni */
.btn{border:1px solid var(--fg);background:transparent;border-radius:0;padding:0 20px;min-height:48px;font:400 .78rem/1 var(--body);letter-spacing:.18em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.line{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:44px;padding:0 14px;font-size:.7rem}
.btn:active{opacity:.75}
.link{border:0;background:none;padding:6px 0;min-height:44px;font:400 .72rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--line)}
/* selettori */
.opts{display:flex;flex-wrap:wrap;gap:6px 18px}
.opt{position:relative;cursor:pointer;padding:11px 0;min-width:44px;text-align:center;font-size:.95rem;color:var(--muted);border-bottom:1px solid transparent}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){color:var(--fg);border-bottom-color:var(--fg)}
.opt:has(input:focus-visible){outline:1px solid var(--accent);outline-offset:3px}
.temp{display:flex;align-items:center;gap:16px}
.temp input{flex:1;min-width:0;accent-color:var(--fg)}
.wx{margin-top:4px;font-size:.8rem;display:flex;flex-wrap:wrap;align-items:center;column-gap:10px}.wx .link{font-size:inherit;color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.temp output{font:400 1.7rem/1 var(--display);min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}
.ctl{display:grid;gap:18px;padding:0 0 20px;border-bottom:1px solid var(--line)}
.ctl .f{display:flex;flex-direction:column;gap:6px}
/* proposta */
.pieces{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.piece{display:flex;flex-direction:column;gap:8px;min-width:0}
.frame{aspect-ratio:3/4;max-width:100%;background:var(--sunk);overflow:hidden;display:grid;place-items:center;position:relative}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame svg{width:58%;height:58%}
.more summary{cursor:pointer;padding:14px 0;border-top:1px solid var(--line);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);list-style:none}.more summary::-webkit-details-marker{display:none}
.flip{perspective:1400px;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.flip .card{position:relative;aspect-ratio:3/4;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .card{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--sunk)}
.flip .face img{width:100%;height:100%;object-fit:cover;display:block}
.flip .back{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.flip .card{transition:none}}
.flip .side{position:absolute;left:10px;bottom:10px;padding:3px 8px;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase}
.fliphint{text-align:center;margin-top:-4px}
.piece .cap{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.piece .cap div{min-width:0}
.piece .nm{font-family:var(--display);font-size:1.02rem;line-height:1.2;overflow-wrap:anywhere}
.piece .mt{font-size:.78rem;color:var(--muted)}
.swap{border:0;background:none;padding:4px 0 4px 8px;min-height:44px;font:400 .66rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);flex:none}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.why li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.why li::before{content:"";width:12px;height:1px;background:var(--accent);margin-top:.8em}
.why li.w::before{background:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.badge{font:400 .6rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:4px 6px;position:absolute;top:8px;left:8px;background:var(--surface)}
.empty{border:1px solid var(--line);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}
.empty h3{color:var(--fg)}
/* look di oggi */
.today{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line)}
.today .frame{aspect-ratio:3/4}
.today .tx{display:flex;flex-direction:column;gap:8px;min-width:0}
.vote{display:flex;gap:8px;flex-wrap:wrap}
.vote button{border:1px solid var(--line);background:transparent;min-height:44px;padding:0 12px;font:400 .68rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.vote button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}
.vote button[aria-pressed="true"].up{border-color:var(--good);color:var(--good)}
.vote button[aria-pressed="true"].dn{border-color:var(--bad);color:var(--bad)}
/* armadio */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;border:0;background:none;padding:0}
.card .nm{font-family:var(--display);font-size:.98rem;line-height:1.2;overflow-wrap:anywhere}
.card .mt{font-size:.74rem;color:var(--muted)}
.count{font:400 .74rem/1 var(--body);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
/* lookbook */
.lookbook{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 14px}
.look{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;background:none;padding:0;min-width:0}
.look .frame{aspect-ratio:3/4}
.collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px}
.collage>div{background:var(--surface);display:grid;place-items:center;overflow:hidden}
.collage img{width:100%;height:100%;object-fit:cover}
.collage svg{width:60%;height:60%}
.look .d{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.look .d b{font:italic 400 1rem/1.2 var(--display)}
.mark{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.mark.up{color:var(--good)}.mark.dn{color:var(--bad)}
.nophoto{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:color-mix(in srgb,var(--bg) 82%,transparent);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* statistiche */
.figs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fig{padding:16px 10px 14px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.fig+.fig{padding-left:12px;border-left:1px solid var(--line)}
.fig b{font:400 2rem/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig span{font-size:.76rem;color:var(--muted);line-height:1.3}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.li:last-child{border-bottom:1px solid var(--line)}
.li .th{width:44px;aspect-ratio:3/4;background:var(--sunk);overflow:hidden;display:grid;place-items:center}
.li .th img{width:100%;height:100%;object-fit:cover}.li .th svg{width:70%;height:70%}
.li .tx{min-width:0}
.li .tx div:first-child{font-family:var(--display);line-height:1.2}
.li .num{font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.meter{height:2px;background:var(--line);margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent)}
/* nav */
.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#0f0e0d;z-index:35}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.bar .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--navh)}
nav.bar button{border:0;background:none;color:var(--muted);font:400 .64rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;position:relative}
nav.bar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
nav.bar button[aria-current="page"]{color:var(--fg)}
nav.bar button[aria-current="page"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:1px;background:var(--fg)}
/* foglio */
.sheet{position:fixed;inset:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:rgba(8,7,6,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{background:var(--bg);width:100%;max-width:620px;max-height:94%;overflow:auto;border-top:1px solid var(--line);
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.sheet .pane>*{flex-shrink:0}
@media (min-width:660px){.sheet{align-items:center}.sheet .pane{border:1px solid var(--line);max-height:90%}}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>.lbl{color:var(--fg)}
input[type=text],input[type=number]{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;font-size:1.05rem}
input[type=text]:focus,input[type=number]:focus{outline:none;border-bottom-color:var(--fg)}
.ph-in{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches label{position:relative;cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.4)}
.swatches input:checked+span{outline:1px solid var(--fg);outline-offset:3px}
.swatches input:focus-visible+span{outline:1px solid var(--accent);outline-offset:3px}
.big{aspect-ratio:3/4;max-height:62vh;margin:0 auto;width:100%;max-width:420px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.strip .frame{width:72px;flex:none}
.err{color:var(--bad);font-size:.85rem;margin:0}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:12px 18px;font:400 .74rem/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;max-width:calc(100% - 32px);text-align:center}
.stylist{display:flex;flex-direction:column;gap:14px;padding:20px 18px;border:1px solid var(--line);background:var(--surface)}
.stylist .sc{display:flex;align-items:flex-start;gap:16px}
.stylist .sc b{font:400 2.8rem/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.stylist .sc b small{font-size:1rem;color:var(--muted)}
.score ul{list-style:none;margin:6px 0 0;padding:0;font-size:.88rem}
.score li{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--line)}
.score li b{font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.score li.up b{color:var(--good)}.score li.dn b{color:var(--bad)}
.score li.tot{border-top:1px solid var(--fg)}.score li.tot span,.score li.cap span{color:var(--muted)}
.score li.cap b{font:400 1.1rem/1 var(--display)}
.stylist q{font:italic 400 1.15rem/1.45 var(--display);quotes:"\201C" "\201D"}
.stylist .wait{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.92rem}
.stylist .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stylist .cols>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1.1s ease-in-out infinite}@keyframes pl{50%{opacity:.2}}}
.pieces.pending{opacity:.45;transition:opacity .3s}
details.rules summary{cursor:pointer;list-style:none;min-height:36px;display:flex;align-items:center}
details.rules summary::-webkit-details-marker{display:none}
details.rules[open] summary{margin-bottom:8px}
@media (max-width:400px){.stylist .cols{grid-template-columns:1fr}}
@media (max-width:400px){h1{font-size:2.2rem}.grid{grid-template-columns:repeat(2,1fr)}.fig b{font-size:1.6rem}}
@media (prefers-reduced-motion:no-preference){
  .app>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .app>*:nth-child(2){animation-delay:.04s}.app>*:nth-child(3){animation-delay:.08s}.app>*:nth-child(4){animation-delay:.12s}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
}
</style>

<div class="sbar" aria-hidden="true"></div>
<main class="app" id="app"></main>
<nav class="bar" aria-label="Sezioni"><div class="in">
  <button data-tab="oggi"><svg viewBox="0 0 24 24"><path d="M12 4.5a1.8 1.8 0 1 1 1.8 1.8c-1 0-1.8.7-1.8 1.7v1L21 15c.8.6.4 1.6-.6 1.6H3.6c-1 0-1.4-1-.6-1.6L12 9"/></svg>Oggi</button>
  <button data-tab="armadio"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18"/><path d="M12 3v18M9.5 11v2M14.5 11v2"/></svg>Armadio</button>
  <button data-tab="look"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18"/><path d="M5 16l4-4 3 3 2-2 5 5"/><circle cx="14.5" cy="8" r="1.5"/></svg>Look</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>Analisi</button>
</div></nav>
<div id="sheet"></div>

<script>
// ===== riferimenti =====
const CATS={top:"Sopra",bottom:"Sotto",dress:"Intero",shoes:"Scarpe",outer:"Capospalla"};
const SEASONS=["primavera","estate","autunno","inverno"];
const OCCS={casual:"Casual",lavoro:"Lavoro",elegante:"Elegante",sport:"Sport"};
const COLORS={nero:"#1d1d1f",bianco:"#f4f4f1",grigio:"#8a8d91",navy:"#1f2a44",denim:"#4a6a8f",beige:"#d8c3a0",cammello:"#b88a55",marrone:"#6b4a32",oliva:"#6b6b3a",
  rosso:"#b3261e",bordeaux:"#6d1f2c",verde:"#2e7d4f",azzurro:"#8ec5e8",giallo:"#e0b52b",arancione:"#d9692b",rosa:"#e48aa6",viola:"#6a4c93",fantasia:"pattern"};
const CLABEL={navy:"blu navy"};
const NEUTRAL=new Set(["nero","bianco","grigio","navy","denim","beige","cammello","marrone","oliva"]);
const cname=c=>CLABEL[c]||c;
const swatchCss=c=>COLORS[c]==="pattern"?"repeating-linear-gradient(45deg,#1f2a44 0 4px,#e8dcc8 4px 8px)":COLORS[c];
const SHAPES={
  top:'<path d="M22 8 L12 12 L4 22 L11 29 L17 25 L17 57 L47 57 L47 25 L53 29 L60 22 L52 12 L42 8 Q32 17 22 8 Z"/>',
  bottom:'<path d="M17 5 L47 5 L51 59 L37 59 L32 23 L27 59 L13 59 Z"/>',
  dress:'<path d="M24 5 L40 5 L38 21 L51 59 L13 59 L26 21 Z"/>',
  shoes:'<path d="M6 36 L6 47 L59 47 Q59 38 50 36 L37 32 L31 21 L20 21 L18 30 Q11 33 6 36 Z"/>',
  outer:'<path d="M22 5 L9 11 L5 59 L18 59 L19 31 L20 59 L44 59 L45 31 L46 59 L59 59 L55 11 L42 5 L32 22 Z"/>'};
function sil(cat,color){const h=COLORS[color]||"#999";
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><pattern id="pt" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#e8dcc8"/><rect width="3" height="6" fill="#1f2a44"/></pattern></defs><g fill="${h==="pattern"?"url(#pt)":h}" stroke="var(--muted)" stroke-width=".8" stroke-linejoin="round">${SHAPES[cat]||SHAPES.top}</g></svg>`}

// ===== utilità =====
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
const fmtLong=s=>new Date(s+"T12:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=s=>new Date(s+"T12:00").toLocaleDateString("it-IT",{day:"numeric",month:"short"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);

const DB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open("guardaroba",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r();q.onblocked=()=>r()}catch(e){r()}})},
  get(k){return new Promise(r=>{try{if(!this.db)return r(null);const q=this.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)}catch(e){r(null)}})},
  put(k,v){return new Promise(r=>{try{if(!this.db)return r(false);const t=this.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}})},
  del(k){try{if(this.db)this.db.transaction("kv","readwrite").objectStore("kv").delete(k)}catch(e){}}
};

function readImage(file,max){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    // colore medio del centro, per proporre il colore del capo
    let tint=null;try{const w=Math.round(c.width*.4),h=Math.round(c.height*.4),d=x.getImageData((c.width-w)>>1,(c.height-h)>>1,w,h).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2];n++}tint=[r/n,g/n,b/n]}catch(e){}
    c.toBlob(b=>b?res({blob:b,tint}):rej(),"image/jpeg",.82)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function nearestColor([r,g,b]){let best="grigio",bd=1e9;for(const[k,h]of Object.entries(COLORS)){if(h==="pattern")continue;const R=parseInt(h.slice(1,3),16),G=parseInt(h.slice(3,5),16),B=parseInt(h.slice(5,7),16);const d=(r-R)**2*.3+(g-G)**2*.59+(b-B)**2*.11;if(d<bd){bd=d;best=k}}return best}

const isShorts=i=>i.cat==="bottom"&&/bermuda|shorts?\b|pantaloncin|corti/i.test(i.name);

const isTee=i=>i.cat==="top"&&!i.layer&&/t-?shirt|maglietta|canotta|\btee\b/i.test(i.name);

const layerOf=list=>{const tops=list.filter(i=>i.cat==="top");return tops.length>1?tops.find(i=>i.layer)||tops[1]:null};
const isHeavy=i=>/manica lunga|maniche lunghe|rugby|felpa|flanella|cashmere|lana|dolcevita|maglion|velluto/i.test(i.name+" "+(i.descr||""));
const warmOk=(i,t)=>isShorts(i)?t>=20:isShortSleeve(i)?t>=17:true;
const coolOk=(i,t)=>!(t>=26&&(isHeavy(i)||(i.cat==="shoes"&&/chelsea|stival|boot/i.test(i.name))));

  if(has("nero")&&has("navy")){s-=8;notes.push({w:1,t:"Nero e blu navy vicini si confondono: tienili lontani dal viso."})}

const pickTop=(a,n)=>a.map(i=>({i,k:fresh(i)+Math.random()*14})).sort((x,y)=>y.k-x.k).slice(0,n).map(x=>x.i);

async function importItems(file){
  if(!file)return;let data;

  if(!arr)return toast("Questo file non contiene capi");
  if(data&&data.backup&&Array.isArray(data.looks))return confirmRestore(data,arr);
  let n=0,skip=0,nl=0;
  try{const r=await addItems(arr);n=r.n;skip=r.skip;nl=await restoreLooks(data,r.idMap)}catch(e){save();cur=null;render();return toast("Il file è in parte danneggiato: ho importato quello che ho potuto")}if(data.prefs&&nl&&typeof data.prefs==="object"){const t=+data.prefs.temp;if(t>=-5&&t<=38)S.prefs.temp=Math.round(t);if(OCCS[data.prefs.occ])S.prefs.occ=data.prefs.occ}if(+data.seedVer>0)S.seedVer=Math.max(S.seedVer||0,Math.min(+data.seedVer,99));
  save();cur=null;render();toast(n||nl?`${data.backup?"Backup ripristinato: ":""}${n} capi${nl?` e ${nl} look`:""}${data.backup?"":" importati"}${skip?`, ${skip} già presenti o non validi`:""}`:"Nessun capo nuovo nel file");
}
function confirmRestore(data,arr){

    <p class="note">Sostituisce tutto quello che c'è ora (${S.items.length} capi e ${S.looks.length} look) con il contenuto del backup: ${ok} capi e ${nl} look.</p>
    <div class="row"><button class="btn solid" id="rs">Ripristina</button></div>`,pane=>{pane.querySelector("#x").onclick=closeSheet;
    pane.querySelector("#rs").onclick=async()=>{pane.querySelector("#rs").disabled=true;closeSheet();toast("Ripristino in corso…");
      const old={items:S.items,looks:S.looks};S.items=[];S.looks=[];let n=0,nl2=0;
      try{const r=await addItems(arr);n=r.n;nl2=await restoreLooks(data,r.idMap)}catch(e){S.items.forEach(i=>dropPhoto(i.photo));S.looks.forEach(l=>{dropPhoto(l.photo);dropPhoto(l.photoBack)});S.items=old.items;S.looks=old.looks;cur=null;render();return toast("Il backup è danneggiato: ho lasciato tutto com'era")}
      if(!n){S.items=old.items;S.looks=old.looks;cur=null;render();return toast("Il backup non contiene capi validi: non ho toccato niente")}
      if(data.prefs&&typeof data.prefs==="object"){const t=+data.prefs.temp;if(t>=-5&&t<=38)S.prefs.temp=Math.round(t);if(OCCS[data.prefs.occ])S.prefs.occ=data.prefs.occ}
      S.seedVer=Math.max(S.seedVer||0,SEED);
      const ok2=await DB.put("state",S);

async function addItems(arr){
  let n=0,skip=0;const idMap={};
  for(const r of arr){
    if(!r||typeof r!=="object"){skip++;continue}
    const name=clip(r.name||r.nome,60);if(!name){skip++;continue}
    const src=clip(r.source||r.url||"",500);
    const dup=S.items.find(i=>(src&&i.source===src)||(!src&&i.name.toLowerCase()===name.toLowerCase()));if(dup){if(r.id)idMap[r.id]=dup.id;skip++;continue}
    const cat=r.cat||r.categoria;if(!CATS[cat]){skip++;continue}
    const color=COLORS[r.color||r.colore]?(r.color||r.colore):"grigio";
    const seasons=(Array.isArray(r.seasons||r.stagioni)?(r.seasons||r.stagioni):[]).filter(x=>SEASONS.includes(x));
    const occ=(Array.isArray(r.occ||r.occasioni)?(r.occ||r.occasioni):[]).filter(x=>OCCS[x]);
    let photo=null;
    if(typeof r.photo==="string"&&r.photo.startsWith("data:image/")){try{const[h,d]=r.photo.split(","),bin=atob(d),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);photo=await savePhoto(new Blob([u],{type:h.slice(5).split(";")[0]}))}catch(e){}}
    const nid=uid();if(r.id)idMap[r.id]=nid;
    S.items.push({id:nid,name,cat,color,seasons:seasons.length?seasons:[...SEASONS],occ:occ.length?occ:["casual"],price:+r.price>0?+r.price:"",descr:clip(r.descr||r.descrizione,120),photo,source:src,brand:clip(r.brand,40),...(r.layer==="aperta"&&cat==="top"?{layer:"aperta"}:{}),...(r.under&&cat==="top"?{under:true}:{})});n++;
  }
  return {n,skip,idMap};
}

async function b64(id){if(!id)return null;const b=await DB.get("ph:"+id);if(!b)return null;return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)})}

async function dataPhoto(str){if(typeof str!=="string"||!str.startsWith("data:image/"))return null;try{const[h,d]=str.split(","),bin=atob(d),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return await savePhoto(new Blob([u],{type:h.slice(5).split(";")[0]}))}catch(e){return null}}
async function restoreLooks(data,idMap){let n=0;if(!Array.isArray(data.looks))return 0;

    const lid=okId(l.id)?l.id:uid();if(S.looks.some(x=>x.id===lid))continue;

const WXC=c=>c==null?"":c===0?"sereno":c<=2?"poco nuvoloso":c===3?"nuvoloso":c<=48?"nebbia":c<=67?"pioggia":c<=77?"neve":c<=82?"rovesci":"temporali";
let wxBusy=false;
const wxToday=()=>{const w=S.prefs.wx;return w&&w.date===today()?w:null};
async function fetchWx(lat,lon){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=1`;
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),9000);
  try{const r=await fetch(u,{signal:ctl.signal,cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();
    const hrs=(j.hourly.time||[]).map((t,k)=>({h:+t.slice(11,13),v:j.hourly.temperature_2m[k],p:j.hourly.precipitation_probability[k]})).filter(x=>x.h>=9&&x.h<=20&&x.v!=null);
    if(!hrs.length)throw 0;
    const avg=hrs.reduce((a,x)=>a+x.v,0)/hrs.length,rain=Math.max(0,...hrs.map(x=>x.p||0));
    return {date:today(),at:Date.now(),t:Math.round(avg),min:Math.round(j.daily.temperature_2m_min[0]),max:Math.round(j.daily.temperature_2m_max[0]),rain,code:j.daily.weather_code[0]}}
  finally{clearTimeout(to)}}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error("nogeo"));navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),e=>rej(e),{timeout:12000,maximumAge:6*3600e3,enableHighAccuracy:false})})}
function applyWx(){const w=wxToday();if(!w||S.prefs.manual===today())return false;const t=Math.max(-5,Math.min(38,w.t));if(S.prefs.temp===t)return false;S.prefs.temp=t;return true}
async function updateWx(askPos){
  if(wxBusy)return;wxBusy=true;
  try{
    if(askPos||!S.prefs.loc){const pos=await getPos();S.prefs.loc={lat:+pos.lat.toFixed(3),lon:+pos.lon.toFixed(3)}}
    const w=await fetchWx(S.prefs.loc.lat,S.prefs.loc.lon);S.prefs.wx=w;
    const ch=applyWx();save();
    if(!document.querySelector("#sheet .pane")){if(ch){cur=null;shown.clear()}render()}
    if(askPos)toast(`Meteo di oggi: ${w.min}°–${w.max}°, uso ${S.prefs.temp}°`);
  }catch(e){if(askPos)toast(e&&e.code===1?"Senza il permesso alla posizione non posso leggere il meteo: imposta i gradi a mano":"Non riesco a leggere il meteo adesso: imposta i gradi a mano")}
  finally{wxBusy=false}}
function maybeWx(){if(!S.prefs.loc)return;const w=S.prefs.wx;if(!w||w.date!==today()||Date.now()-w.at>2*3600e3)updateWx(false)}
const SEED=37;
async function seedWardrobe(){
  if((S.seedVer||0)>=SEED)return;
  let data;try{const r=await fetch("guardaroba.json?v="+SEED,{cache:"no-store"});if(!r.ok)return;data=await r.json()}catch(e){return}
  const arr=data&&Array.isArray(data.items)?data.items:null;if(!arr)return;
  if(S.items.length&&S.items.every(i=>i.example)){S.items=[];S.looks=S.looks.filter(l=>!l.example)}
  for(const r of arr){if(!r||!r.was)continue;const was=(Array.isArray(r.was)?r.was:[r.was]).filter(x=>typeof x==="string").map(x=>x.toLowerCase());const it=S.items.find(i=>was.includes(i.name.toLowerCase()));if(!it)continue;
    it.name=clip(r.name,60)||it.name;if(+r.price>0)it.price=+r.price;if(r.descr)it.descr=clip(r.descr,120);if(r.source)it.source=clip(r.source,500);if(COLORS[r.color])it.color=r.color}
